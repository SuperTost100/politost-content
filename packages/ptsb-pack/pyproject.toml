[project]
name = "ptsb-pack"
version = "1.2.0"
description = "CLI per impacchettare Smartbook in formato .ptsb"
readme = "README.md"
license = { text = "AGPL-3.0" }
requires-python = ">=3.11"
dependencies = [
    "cryptography>=43.0.0",
]

[project.scripts]
ptsb-pack = "ptsb_pack.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ptsb_pack"]
