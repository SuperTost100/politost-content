# Push an annotated tag `content-core-vX.Y.Z` whose message holds the release notes.
# This workflow checks the version, runs the tests and attaches the npm tarball to the release.
name: Release content-core
on:
  push:
    tags: ['content-core-v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/content-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/content-core/package-lock.json
      - name: Tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          test "${GITHUB_REF_NAME}" = "content-core-v${version}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"; exit 1; }
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm pack
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" politost-content-core-*.tgz \
            --verify-tag --notes-from-tag --title "content-core ${GITHUB_REF_NAME#content-core-}"
